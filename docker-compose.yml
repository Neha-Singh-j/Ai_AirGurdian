services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airguardian
      POSTGRES_PASSWORD: airguardian
      POSTGRES_DB: airguardian
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airguardian"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://airguardian:airguardian@db:5432/airguardian
      SECRET_KEY: dev-secret-key-change-in-production
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      USE_MOCK_DATA: "true"
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
    volumes:
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
